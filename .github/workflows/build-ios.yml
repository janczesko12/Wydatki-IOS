name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Firebase config
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_BASE64 GitHub secret is required."
            exit 1
          fi

          mkdir -p iosApp/iosApp
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          test -s iosApp/iosApp/GoogleService-Info.plist
          echo "GoogleService-Info.plist prepared at iosApp/iosApp/GoogleService-Info.plist."

      - name: Validate Xcode project
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -showBuildSettings >/dev/null
          echo "Xcode project parsed successfully."

      - name: Generate CocoaPods workspace
        run: |
          ./gradlew :composeApp:podInstall
          test -d iosApp/iosApp.xcworkspace
          echo "CocoaPods workspace prepared."

      - name: Prepare iOS Simulator runtime
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

          if ! xcrun simctl list runtimes | grep -q 'iOS 18'; then
            echo "iOS 18 Simulator runtime is missing; downloading it..."
            xcodebuild -downloadPlatform iOS
          else
            echo "iOS 18 Simulator runtime is already installed; skipping download."
          fi

          echo "Available iOS simulator runtimes:"
          xcrun simctl list runtimes

      - name: Verify iOS Simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q 'iOS 18'; then
            echo "ERROR: No iOS 18 Simulator runtime is installed."
            exit 1
          fi
          echo "iOS Simulator runtime detected."

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_ARCHS=x86_64 \
            build

      - name: Package app
        shell: bash
        run: |
          mkdir -p artifacts

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphonesimulator/iosApp.app' \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iosApp.app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ditto "$APP_PATH" artifacts/iosApp.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Wydatki-iOS-Simulator
          path: artifacts/iosApp.app
