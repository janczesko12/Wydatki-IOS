name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Firebase config
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/GoogleService-Info.plist
            test -s iosApp/GoogleService-Info.plist
            echo "GoogleService-Info.plist prepared."
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 is not configured."
            echo "Continuing without Firebase config."
          fi

      - name: Prepare Xcode KMP integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("iosApp/iosApp.xcodeproj/project.pbxproj")
          text = path.read_text()

          old = '''\t\t\tbuildPhases = (\n\t\t\t\tB234977C2B104F5C00123456 /* Sources */,\n\t\t\t\tB234977D2B104F5C00123456 /* Frameworks */,\n\t\t\t\tB234977E2B104F5C00123456 /* Resources */,\n\t\t\t\tB234978C2B104F5C00123456 /* ShellScript */,\n\t\t\t);'''
          new = '''\t\t\tbuildPhases = (\n\t\t\t\tB234978C2B104F5C00123456 /* ShellScript */,\n\t\t\t\tB234977C2B104F5C00123456 /* Sources */,\n\t\t\t\tB234977D2B104F5C00123456 /* Frameworks */,\n\t\t\t\tB234977E2B104F5C00123456 /* Resources */,\n\t\t\t);'''
          if old not in text:
              raise SystemExit("Could not find Xcode build phase order")
          text = text.replace(old, new, 1)

          old_script = '''\t\t\tshellScript = "cd \\\"$SRCROOT/..\\\"\\n./gradlew :composeApp:embedAndSignAppleFrameworkForXcode";'''
          new_script = '''\t\t\tshellScript = "set -e\\nif [ \\\"YES\\\" = \\\"$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED\\\" ]; then\\n  echo \\\"Skipping Kotlin framework build because OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES\\\"\\n  exit 0\\nfi\\ncd \\\"$SRCROOT/..\\\"\\nchmod +x ./gradlew\\n./gradlew :composeApp:embedAndSignAppleFrameworkForXcode";'''
          if old_script in text:
              text = text.replace(old_script, new_script, 1)
          else:
              raise SystemExit("Could not find KMP Xcode run script")

          # ComposeApp currently exposes iosSimulatorArm64, not x86_64.
          # Keep the simulator build compatible with the available framework.
          marker = '\t\t\t\tENABLE_PREVIEWS = YES;\n'
          replacement = marker + '\t\t\t\tEXCLUDED_ARCHS[sdk=iphonesimulator*] = x86_64;\n'
          text = text.replace(marker, replacement, 2)

          path.write_text(text)
          print("Xcode KMP integration prepared")
          PY

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            BUNDLE_LOADER= \
            EXCLUDED_ARCHS=x86_64 \
            build

      - name: Package app
        shell: bash
        run: |
          mkdir -p artifacts

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphonesimulator/iosApp.app' \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iosApp.app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ditto "$APP_PATH" artifacts/iosApp.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Wydatki-iOS-Simulator
          path: artifacts/iosApp.app
