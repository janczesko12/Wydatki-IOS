name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare Firebase config
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > iosApp/GoogleService-Info.plist
            test -s iosApp/GoogleService-Info.plist
            echo "GoogleService-Info.plist prepared."
          else
            echo "GOOGLE_SERVICE_INFO_PLIST_BASE64 is not configured."
            echo "Continuing without Firebase config."
          fi

      - name: Build Compose framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        shell: bash
        run: |
          mkdir -p artifacts

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphonesimulator/iosApp.app' \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iosApp.app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ditto "$APP_PATH" artifacts/iosApp.app

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: Wydatki-iOS-Simulator
          path: artifacts/iosApp.app
